<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تمرینِ گفتار — TCF Avec Hoda KHEDMATI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  :root{
    --ink:#1a1a2e; --gray:#6b6b88; --line:#e3e3f0; --soft:#f5f4fa;
    --navy:#0f3460; --purple:#533483; --green:#1f6b4e; --amber:#a8791f; --red:#a83232;
    --tap:48px; --gut:18px; --maxw:640px;
  }
  html{ -webkit-text-size-adjust:100%; }
  body{ font-family:'Vazirmatn',Tahoma,sans-serif; font-size:17px; line-height:1.75;
        background:#fbfbfe; color:var(--ink); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  button{ font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  :focus-visible{ outline:3px solid var(--purple); outline-offset:3px; }

  .navbar{ background:var(--navy); color:#fff; padding-top:env(safe-area-inset-top); }
  .navbar .in{ max-width:var(--maxw); margin:0 auto; display:flex; align-items:center; gap:14px;
    padding:6px max(var(--gut),env(safe-area-inset-right)) 6px max(var(--gut),env(safe-area-inset-left)); }
  .navbar a{ color:#fff; text-decoration:none; font-weight:700; font-size:15px;
             display:inline-flex; align-items:center; min-height:var(--tap); padding:0 6px; }
  .navbar .brand{ margin-inline-start:auto; font-size:12.5px; opacity:.85; font-weight:600; }

  .shell{ max-width:var(--maxw); margin:0 auto;
    padding:0 max(var(--gut),env(safe-area-inset-right)) 40px max(var(--gut),env(safe-area-inset-left)); }

  /* ── progression : voir où on en est, tout le temps ── */
  .prog{ display:flex; gap:5px; margin:16px 0 4px; }
  .prog i{ flex:1; height:7px; border-radius:4px; background:var(--line); transition:background .25s; }
  .prog i.done{ background:var(--green); }
  .prog i.now{ background:var(--purple); }
  .prog-lbl{ font-size:12.5px; color:var(--gray); text-align:center; margin-bottom:14px; }

  /* ── la carte du bloc en cours : une seule chose à l'écran ── */
  .bloc{ background:#fff; border:1px solid var(--line); border-radius:18px; overflow:hidden;
         box-shadow:0 2px 10px rgba(15,52,96,.05); }
  .bloc-head{ padding:16px 18px 14px; border-bottom:1px solid var(--line); }
  .etq{ display:inline-block; font-size:12px; font-weight:800; color:#fff;
        padding:3px 12px; border-radius:20px; background:var(--navy); margin-bottom:8px; }
  .etq.arg{ background:var(--purple); } .etq.conc{ background:var(--green); }
  .bloc-titre{ font-family:'Newsreader',Georgia,serif; direction:ltr; text-align:left;
               font-size:19px; font-weight:500; line-height:1.35; }

  /* ── chronomètre : le temps se voit, il ne se devine pas ── */
  .chrono{ padding:12px 18px; background:var(--soft); display:flex; align-items:center; gap:12px; }
  .chrono-bar{ flex:1; height:9px; background:var(--line); border-radius:5px; overflow:hidden; }
  .chrono-fill{ height:100%; width:100%; background:var(--green); transition:width 1s linear; }
  .chrono-fill.warn{ background:var(--amber); } .chrono-fill.over{ background:var(--red); }
  .chrono-txt{ font-family:'Courier New',monospace; font-weight:800; font-size:16px; min-width:52px; text-align:center; }
  .chrono-btn{ background:#fff; border:2px solid var(--line); border-radius:22px;
               min-height:38px; padding:4px 16px; font-size:13.5px; font-weight:700; color:var(--ink); }

  /* ── la première phrase : supprimer le coût du démarrage ── */
  .depart{ margin:16px 18px 0; background:#eef4fc; border:1px solid #c9ddf4;
           border-inline-start:4px solid var(--navy); border-radius:12px; padding:13px 15px; }
  .depart .lbl{ font-size:12px; font-weight:800; color:var(--navy); }
  .depart .ph{ font-family:'Newsreader',Georgia,serif; direction:ltr; text-align:left;
               font-size:18px; font-weight:500; margin-top:5px; }

  /* ── les idées ── */
  .idees{ list-style:none; padding:14px 18px 6px; }
  .idees li{ padding:9px 0; border-bottom:1px dashed var(--line); display:flex; gap:10px; align-items:flex-start; }
  .idees li:last-child{ border-bottom:0; }
  .idees .pt{ width:7px; height:7px; border-radius:50%; background:var(--purple); margin-top:11px; flex:none; }
  .id-fr{ display:block; font-family:'Newsreader',Georgia,serif; direction:ltr; text-align:left;
          font-size:16.5px; font-weight:500; color:var(--navy); }
  .id-fa{ display:block; font-size:13.5px; color:var(--gray); }

  /* ── mode « repères seuls » : on cache le français, on garde le sens ── */
  body.fade1 .id-fr{ filter:blur(5px); opacity:.35; }
  body.fade1 .idees li:active .id-fr,
  body.fade1 .id-fr.vu{ filter:none; opacity:1; }
  body.fade2 .idees, body.fade2 .depart, body.fade2 .amorces{ display:none; }
  .fade2-msg{ display:none; padding:22px 18px; text-align:center; font-size:15px; color:var(--gray); }
  body.fade2 .fade2-msg{ display:block; }

  .amorces{ background:#f7f5fc; border-top:1px solid var(--line); padding:12px 18px;
            display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .am-lbl{ font-size:12.5px; font-weight:800; color:var(--purple); width:100%; }
  .am{ font-family:'Newsreader',Georgia,serif; direction:ltr; font-size:14.5px;
       background:#fff; border:1px solid #d9d2ec; border-radius:16px; padding:4px 12px; }

  /* ── commandes ── */
  .cmds{ display:flex; gap:10px; margin-top:16px; }
  .btn{ flex:1; min-height:var(--tap); border-radius:14px; border:2px solid var(--line);
        background:#fff; font-size:15px; font-weight:800; color:var(--ink); }
  .btn.go{ background:var(--green); border-color:var(--green); color:#fff; flex:2; }
  .btn.go:disabled{ opacity:.45; }

  /* ── réglage de l'aide ── */
  .aide{ background:#fff; border:1px solid var(--line); border-radius:14px;
         padding:12px 15px; margin-top:14px; }
  .aide-lbl{ font-size:13px; font-weight:800; margin-bottom:9px; }
  .aide-row{ display:flex; gap:7px; }
  .aide-b{ flex:1; min-height:42px; border-radius:11px; border:2px solid var(--line);
           background:var(--soft); font-size:13px; font-weight:700; color:var(--ink); padding:4px; }
  .aide-b.on{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .aide-note{ font-size:12px; color:var(--gray); margin-top:8px; }

  /* ── fin ── */
  .fin{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:28px 20px; text-align:center; }
  .fin .big{ font-size:42px; }
  .fin h2{ font-size:21px; font-weight:800; margin:8px 0; }
  .fin p{ font-size:14.5px; color:var(--gray); }
  .fin .recap{ text-align:start; background:var(--soft); border-radius:12px; padding:12px 15px; margin-top:16px; font-size:13.5px; }
  .fin .recap b{ color:var(--navy); }

  footer{ margin-top:40px; padding:20px 0 calc(20px + env(safe-area-inset-bottom));
          border-top:1px solid var(--line); font-size:12.5px; color:var(--gray); text-align:center; }
</style>
</head>
<body>

<div class="navbar"><div class="in">
  <a href="index.html">← خانه</a>
  <a id="lienFiche" href="blocs.html?id=7">متنِ کامل</a>
  <span class="brand">تمرینِ گفتار</span>
</div></div>

<div class="shell" id="root"></div>
<footer>Hoda KHEDMATI — Expression Orale · Tâche 3</footer>

<script src="blocs-data.js"></script>
<script>
var esc = function(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
var faNum = function(n){ return String(n).replace(/[0-9]/g, function(d){ return '۰۱۲۳۴۵۶۷۸۹'[d]; }); };

var pid = parseInt(new URLSearchParams(location.search).get('id'), 10) || 7;
var F = BLOCS_SUJETS.filter(function(x){ return x.id === pid; })[0];
document.getElementById('lienFiche').href = 'blocs.html?id=' + pid;

var P = (F && F.pratique) ? F.pratique : [];
var i = 0;              // bloc en cours
var faits = [];         // blocs terminés
var aide = 0;           // 0 = tout · 1 = repères · 2 = rien
var secs = 0, tot = 0, tick = null, lance = false;

function dureeSec(txt){
  var m = String(txt||'').replace(/[۰-۹]/g, function(d){ return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d); }).match(/\d+/);
  return m ? parseInt(m[0], 10) : 60;
}
function mmss(s){
  var neg = s < 0; s = Math.abs(s);
  return (neg ? '−' : '') + Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
function classeEtq(lbl){
  if (/CONCLUSION/.test(lbl)) return 'conc';
  if (/INTRODUCTION/.test(lbl)) return '';
  return 'arg';
}

function render(){
  document.body.className = 'fade' + aide;

  if (i >= P.length){
    document.getElementById('root').innerHTML =
      '<div class="fin"><div class="big">🎉</div><h2>تمام شد</h2>'
    + '<p>هر شش بلوک را گفتی. حالا یک بار پشتِ سرِ هم، بدونِ توقف.</p>'
    + '<div class="recap">'
    +   '<b>دفعه‌ی بعد:</b> اگر این بار با «همه‌چیز» تمرین کردی، دفعه‌ی بعد برو روی «فقط نشانه». '
    +   'وقتی آن هم راحت شد، «بدونِ کمک». هر بار یک پله.'
    + '</div>'
    + '<div class="cmds"><button class="btn" onclick="recommencer()">↻ از اول</button>'
    +   '<button class="btn go" onclick="monter()">پله‌ی بعد ↑</button></div></div>';
    return;
  }

  var b = P[i];
  tot = dureeSec(b.duree);
  if (!lance) secs = tot;

  var idees = b.idees.map(function(x){
    return '<li><span class="pt"></span><span>'
         + '<span class="id-fr" onclick="this.classList.add(\'vu\')">' + esc(x.fr) + '</span>'
         + '<span class="id-fa">' + esc(x.fa) + '</span></span></li>';
  }).join('');

  var amorces = b.amorces.map(function(a){ return '<span class="am">' + esc(a) + '</span>'; }).join('');

  document.getElementById('root').innerHTML =
    '<div class="prog">' + P.map(function(_, k){
        return '<i class="' + (faits.indexOf(k) >= 0 ? 'done' : (k === i ? 'now' : '')) + '"></i>';
      }).join('') + '</div>'
  + '<div class="prog-lbl">بلوکِ ' + faNum(i+1) + ' از ' + faNum(P.length) + '</div>'

  + '<div class="bloc">'
  +   '<div class="bloc-head">'
  +     '<span class="etq ' + classeEtq(b.label) + '">' + faNum(i+1) + '</span>'
  +     '<div class="bloc-titre">' + esc(b.label) + '</div>'
  +   '</div>'

  +   '<div class="chrono">'
  +     '<span class="chrono-txt" id="ctxt">' + mmss(secs) + '</span>'
  +     '<div class="chrono-bar"><i class="chrono-fill" id="cfill" style="display:block;width:'
  +        (tot ? Math.max(0, secs/tot*100) : 100) + '%"></i></div>'
  +     '<button class="chrono-btn" onclick="toggle()">' + (lance ? '⏸' : '▶︎ شروع') + '</button>'
  +   '</div>'

  +   '<div class="depart"><div class="lbl">با این جمله شروع کن — بلند بگو</div>'
  +     '<div class="ph">' + esc(b.amorces[0] || '') + '</div></div>'

  +   '<ul class="idees">' + idees + '</ul>'

  +   '<div class="amorces"><span class="am-lbl">برای هر حرکت:</span>' + amorces + '</div>'

  +   '<div class="fade2-msg">🎙️ بدونِ کمک. فقط اسمِ بلوک را داری.<br>'
  +     'اگر گیر کردی، دکمه‌ی «کمک» را بزن.</div>'
  + '</div>'

  + '<div class="cmds">'
  +   (i > 0 ? '<button class="btn" onclick="prec()">→ قبلی</button>' : '')
  +   '<button class="btn go" onclick="suivant()">گفتم ✓ بعدی</button>'
  + '</div>'

  + '<div class="aide"><div class="aide-lbl">چقدر کمک می‌خواهی؟</div>'
  +   '<div class="aide-row">'
  +     '<button class="aide-b' + (aide===0?' on':'') + '" onclick="setAide(0)">همه‌چیز</button>'
  +     '<button class="aide-b' + (aide===1?' on':'') + '" onclick="setAide(1)">فقط نشانه</button>'
  +     '<button class="aide-b' + (aide===2?' on':'') + '" onclick="setAide(2)">بدونِ کمک</button>'
  +   '</div>'
  +   '<div class="aide-note">هر بار که راحت‌تر شدی یک پله بالا برو. سخت‌تر شدنِ تمرین همان چیزی است که در حافظه می‌مانَد.</div>'
  + '</div>';
}

function maj(){
  var t = document.getElementById('ctxt'), f = document.getElementById('cfill');
  if (!t || !f) return;
  t.textContent = mmss(secs);
  var pct = tot ? Math.max(0, secs / tot * 100) : 0;
  f.style.width = pct + '%';
  f.className = 'chrono-fill' + (secs < 0 ? ' over' : (pct < 25 ? ' warn' : ''));
  if (secs < 0){ f.style.width = '100%'; }
}
window.toggle = function(){
  lance = !lance;
  if (tick){ clearInterval(tick); tick = null; }
  if (lance) tick = setInterval(function(){ secs--; maj(); }, 1000);
  render();
};
window.suivant = function(){
  if (faits.indexOf(i) < 0) faits.push(i);
  if (tick){ clearInterval(tick); tick = null; }
  lance = false; i++; render();
};
window.prec = function(){
  if (tick){ clearInterval(tick); tick = null; }
  lance = false; if (i > 0) i--; render();
};
window.setAide = function(v){ aide = v; render(); };
window.recommencer = function(){ i = 0; faits = []; lance = false; render(); };
window.monter = function(){ if (aide < 2) aide++; i = 0; faits = []; lance = false; render(); };

if (!P.length){
  document.getElementById('root').innerHTML =
    '<div class="fin"><div class="big">🚧</div><h2>این موضوع هنوز ترامه ندارد</h2>'
  + '<p>فعلاً موضوعِ «تحصیل و موفقیت شغلی» آماده است.</p>'
  + '<div class="cmds"><a class="btn go" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="parler.html?id=7">برو به آن</a></div></div>';
} else render();
</script>
</body>
</html>
