<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مسیرِ حرف زدن — TCF Avec Hoda KHEDMATI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  :root{
    --ink:#2E2118; --gray:#8A7360; --line:#F0E2D4; --soft:#FDF4EC;
    --navy:#C2410C; --purple:#B45309; --amber:#B45309; --green:#0F766E;
    --tap:48px; --gut:16px; --maxw:560px;
  }
  html{ -webkit-text-size-adjust:100%; }
  body{ font-family:'Vazirmatn',Tahoma,sans-serif; font-size:16.5px; line-height:1.7;
        background:#FFFCF7; color:var(--ink); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  button{ font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  :focus-visible{ outline:3px solid var(--purple); outline-offset:3px; }

  .bar{ background:var(--navy); color:#fff; padding-top:env(safe-area-inset-top); }
  .bar .in{ max-width:var(--maxw); margin:0 auto; display:flex; align-items:center; gap:12px;
    padding:4px max(var(--gut),env(safe-area-inset-right)) 4px max(var(--gut),env(safe-area-inset-left)); }
  .bar a{ color:#fff; text-decoration:none; font-weight:700; font-size:14.5px;
          display:inline-flex; align-items:center; min-height:44px; padding:0 4px; }
  .bar .t{ margin-inline-start:auto; font-size:12px; opacity:.85; font-weight:600; }

  .shell{ max-width:var(--maxw); margin:0 auto;
    padding:0 max(var(--gut),env(safe-area-inset-right)) 36px max(var(--gut),env(safe-area-inset-left)); }

  /* ── où j'en suis : six pastilles, toujours visibles ── */
  .etapes{ display:flex; gap:6px; margin:14px 0 6px; }
  .etapes b{ flex:1; height:34px; border-radius:9px; background:var(--soft);
             border:2px solid var(--line); display:flex; align-items:center; justify-content:center;
             font-size:15px; transition:.2s; }
  .etapes b.done{ background:#E6F5F3; border-color:#A9DBD5; }
  .etapes b.now{ background:var(--navy); border-color:var(--navy); transform:scale(1.06); }
  .etapes-lbl{ text-align:center; font-size:12.5px; color:var(--gray); margin-bottom:12px; }

  /* ── le bloc ── */
  .bloc{ background:#fff; border:1px solid var(--line); border-radius:18px; overflow:hidden; }
  .tete{ padding:15px 17px 13px; }
  .tete .nom{ font-family:'Newsreader',Georgia,serif; direction:ltr; text-align:left;
              font-size:18px; font-weight:500; line-height:1.3; }
  .tete .ico{ font-size:26px; }

  /* ── chrono ── */
  .chrono{ display:flex; align-items:center; gap:11px; padding:9px 17px; background:var(--soft);
           border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .cbar{ flex:1; height:8px; background:var(--line); border-radius:5px; overflow:hidden; }
  .cfill{ display:block; height:100%; width:100%; background:var(--green); transition:width 1s linear; }
  .cfill.w{ background:var(--amber); } .cfill.o{ background:#BE3455; }
  .ctxt{ font-family:'Courier New',monospace; font-weight:800; font-size:15px; min-width:46px; text-align:center; }
  .cbtn{ background:#fff; border:2px solid var(--line); border-radius:20px; min-height:36px;
         padding:2px 15px; font-size:13px; font-weight:800; color:var(--ink); }

  /* ── LA CHAÎNE : le cœur ── */
  .chaine{ padding:6px 15px 12px; }
  .maillon{ display:flex; gap:11px; align-items:flex-start; padding:9px 0; }
  .mico{ width:42px; height:42px; border-radius:12px; flex:none;
         display:flex; align-items:center; justify-content:center; font-size:22px;
         background:var(--soft); border:2px solid var(--line); }
  .mtxt{ flex:1; min-width:0; padding-top:1px; }
  .mfr{ font-family:'Newsreader',Georgia,serif; direction:ltr; text-align:left;
        font-size:16px; font-weight:500; line-height:1.35; }
  .mfa{ font-size:13.5px; color:var(--gray); margin-top:2px; }

  /* couleur = rôle logique. l'élève apprend la FORME du raisonnement */
  .mv1 .mico{ background:#FDE9DC; border-color:#F3C6A8; }
  .mv2 .mico{ background:#FEF1E6; border-color:#EBD9C2; }
  .mv3 .mico{ background:#FDF3DF; border-color:#EBD9C2; }
  .mv4 .mico{ background:#E6F5F3; border-color:#A9DBD5; }
  .mv1 .mfr{ color:var(--navy); } .mv2 .mfr{ color:var(--purple); }
  .mv3 .mfr{ color:var(--amber); } .mv4 .mfr{ color:var(--green); }

  /* la flèche porte le NOM du lien : c'est ça, « عقلانی » */
  .fleche{ display:flex; align-items:center; gap:8px; padding:2px 0 2px 0; margin-inline-start:20px; }
  .fleche i{ width:2px; height:16px; background:var(--line); flex:none; }
  .fleche span{ font-size:11.5px; font-weight:800; color:var(--gray);
                background:var(--soft); border-radius:20px; padding:1px 10px; }

  /* ── cacher le français : la vraie production ── */
  body.cache .mfr{ filter:blur(6px); opacity:.4; }
  body.cache .mfr.vu{ filter:none; opacity:1; }
  .astuce{ font-size:12px; color:var(--gray); padding:0 17px 12px; display:none; }
  body.cache .astuce{ display:block; }

  /* ── amorces ── */
  .amorces{ background:#FEF6EC; border-top:1px solid var(--line); padding:11px 17px;
            display:flex; flex-wrap:wrap; gap:6px; }
  .amorces b{ width:100%; font-size:12px; color:var(--purple); }
  .am{ font-family:'Newsreader',Georgia,serif; direction:ltr; font-size:14px;
       background:#fff; border:1px solid #EBD9C2; border-radius:15px; padding:3px 11px; }

  /* ── commandes ── */
  .cmds{ display:flex; gap:9px; margin-top:14px; }
  .b{ min-height:var(--tap); border-radius:14px; border:2px solid var(--line);
      background:#fff; font-size:15px; font-weight:800; color:var(--ink); padding:0 16px; }
  .b.go{ flex:1; background:var(--green); border-color:var(--green); color:#fff; }
  .b.sw{ flex:1; }
  .b.sw.on{ background:var(--navy); border-color:var(--navy); color:#fff; }

  /* ── légende : ce que veulent dire les couleurs ── */
  .leg{ background:#fff; border:1px solid var(--line); border-radius:14px;
        padding:11px 14px; margin-top:13px; display:flex; flex-wrap:wrap; gap:7px; }
  .leg b{ width:100%; font-size:12.5px; margin-bottom:2px; }
  .leg span{ font-size:12px; font-weight:700; border-radius:16px; padding:3px 11px; }
  .l1{ background:#FDE9DC; color:var(--navy); } .l2{ background:#FEF1E6; color:var(--purple); }
  .l3{ background:#FDF3DF; color:var(--amber); } .l4{ background:#E6F5F3; color:var(--green); }

  .fin{ background:#fff; border:1px solid var(--line); border-radius:18px;
        padding:26px 20px; text-align:center; }
  .fin .e{ font-size:40px; } .fin h2{ font-size:20px; margin:6px 0; }
  .fin p{ font-size:14px; color:var(--gray); }
  footer{ margin-top:36px; padding:18px 0 calc(18px + env(safe-area-inset-bottom));
          border-top:1px solid var(--line); font-size:12px; color:var(--gray); text-align:center; }
</style>
</head>
<body>

<div class="bar"><div class="in">
  <a href="index.html">← خانه</a>
  <a id="lf" href="blocs.html?id=10">متن</a>
  <span class="t">مسیرِ حرف زدن</span>
</div></div>

<div class="shell" id="root"></div>
<footer>Hoda KHEDMATI — Expression Orale · Tâche 3</footer>

<script src="blocs-data.js"></script>
<script>
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
var fa=function(n){return String(n).replace(/[0-9]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d];});};

var pid = parseInt(new URLSearchParams(location.search).get('id'),10) || 10;
var F = BLOCS_SUJETS.filter(function(x){return x.id===pid;})[0];
document.getElementById('lf').href = 'blocs.html?id=' + pid;
var P = (F && F.parcours) ? F.parcours : [];

var ICO  = ['📣','🧭','🔍','⚖️','💬','🎯'];
var LIEN = { 1:'می‌گویم چه', 2:'چرا؟', 3:'مثلاً', 4:'پس' };
var i=0, faits=[], cache=false, secs=0, tot=0, tick=null, run=false;

function mmss(s){ var n=s<0; s=Math.abs(s); return (n?'−':'')+Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

function render(){
  document.body.className = cache ? 'cache' : '';

  if (i >= P.length){
    document.getElementById('root').innerHTML =
      '<div class="fin"><div class="e">🎉</div><h2>هر شش بلوک را گفتی</h2>'
    + '<p>حالا یک بار پشتِ سرِ هم، بدونِ توقف.<br>دفعه‌ی بعد دکمه‌ی «فرانسه را بپوشان» را بزن.</p>'
    + '<div class="cmds"><button class="b" onclick="reset()">↻ از اول</button>'
    + '<button class="b go" onclick="cache=true;reset()">سخت‌ترش کن 🙈</button></div></div>';
    return;
  }

  var b = P[i];
  tot = b.sec; if (!run) secs = tot;

  var chaine = '';
  b.maillons.forEach(function(m, k){
    if (k > 0 && m.mv !== b.maillons[k-1].mv)
      chaine += '<div class="fleche"><i></i><span>'+ (LIEN[m.mv]||'') +'</span></div>';
    chaine += '<div class="maillon mv'+m.mv+'">'
           +   '<span class="mico">'+m.ico+'</span>'
           +   '<span class="mtxt">'
           +     '<span class="mfr" onclick="this.classList.add(\'vu\')">'+esc(m.fr)+'</span>'
           +     '<span class="mfa">'+esc(m.fa)+'</span>'
           +   '</span></div>';
  });

  document.getElementById('root').innerHTML =
    '<div class="etapes">' + P.map(function(_,k){
      return '<b class="'+(faits.indexOf(k)>=0?'done':(k===i?'now':''))+'">'+ICO[k]+'</b>';
    }).join('') + '</div>'
  + '<div class="etapes-lbl">بلوکِ '+fa(i+1)+' از '+fa(P.length)+'</div>'

  + '<div class="bloc">'
  +   '<div class="tete"><span class="ico">'+ICO[i]+'</span><div class="nom">'+esc(b.label)+'</div></div>'
  +   '<div class="chrono">'
  +     '<span class="ctxt" id="ct">'+mmss(secs)+'</span>'
  +     '<span class="cbar"><i class="cfill" id="cf" style="width:100%"></i></span>'
  +     '<button class="cbtn" onclick="go()">'+(run?'⏸':'▶︎')+'</button>'
  +   '</div>'
  +   '<div class="chaine">'+chaine+'</div>'
  +   '<div class="astuce">💡 روی هر خطِ مات بزن تا فرانسه‌اش را ببینی.</div>'
  +   '<div class="amorces"><b>عبارت‌های شروع</b>'
  +     b.amorces.map(function(a){return '<span class="am">'+esc(a)+'</span>';}).join('')
  +   '</div>'
  + '</div>'

  + '<div class="cmds">'
  +   (i>0 ? '<button class="b" onclick="prec()">→</button>' : '')
  +   '<button class="b sw'+(cache?' on':'')+'" onclick="sw()">'+(cache?'🙈 پوشانده':'👁️ فرانسه را بپوشان')+'</button>'
  +   '<button class="b go" onclick="next()">گفتم ✓</button>'
  + '</div>'

  + '<div class="leg"><b>رنگ‌ها مسیرِ استدلال را نشان می‌دهند:</b>'
  +   '<span class="l1">۱ می‌گویم چه</span><span class="l2">۲ چرا</span>'
  +   '<span class="l3">۳ مثال</span><span class="l4">۴ پس</span></div>';
}

function maj(){
  var t=document.getElementById('ct'), f=document.getElementById('cf');
  if(!t||!f) return;
  t.textContent = mmss(secs);
  var p = tot ? Math.max(0, secs/tot*100) : 0;
  f.style.width = (secs<0?100:p)+'%';
  f.className = 'cfill' + (secs<0?' o':(p<25?' w':''));
}
window.go = function(){ run=!run; if(tick){clearInterval(tick);tick=null;}
  if(run) tick=setInterval(function(){secs--;maj();},1000); render(); };
window.next = function(){ if(faits.indexOf(i)<0) faits.push(i);
  if(tick){clearInterval(tick);tick=null;} run=false; i++; render(); };
window.prec = function(){ if(tick){clearInterval(tick);tick=null;} run=false; if(i>0)i--; render(); };
window.sw   = function(){ cache=!cache; render(); };
window.reset= function(){ i=0; faits=[]; run=false; render(); };

if(!P.length){
  document.getElementById('root').innerHTML =
    '<div class="fin"><div class="e">🚧</div><h2>این موضوع هنوز مسیر ندارد</h2>'
  + '<p>فعلاً «مصرف‌گرایی» آماده است.</p>'
  + '<div class="cmds"><a class="b go" style="text-decoration:none;display:flex;align-items:center;justify-content:center" href="parler.html?id=10">برو به آن</a></div></div>';
} else render();
</script>
</body>
</html>
