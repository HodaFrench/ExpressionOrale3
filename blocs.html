<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>بلوک‌ها · تمرین ترجمه — Expression Orale · TCF Avec Hoda</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --ink:#1a1a2e; --navy:#0f3460; --purple:#533483;
    --line:#e2e2ee; --soft:#f6f6fb; --gray:#6b7280;
    --fr:#1565c0; --fr-bg:#e9f2fd; --fr-bd:#bcd9f7; --amber:#e65100;
  }
  body{ font-family:'Tahoma',Arial,sans-serif; background:linear-gradient(135deg,#1a1a2e,#16213e); color:var(--ink); line-height:1.9; min-height:100vh; padding-bottom:60px; }
  .navbar{ background:rgba(0,0,0,.5); padding:14px 18px; display:flex; align-items:center; justify-content:center; gap:18px; position:sticky; top:0; z-index:100; }
  .navbar a{ color:#fff; text-decoration:none; font-weight:700; font-size:15px; display:inline-flex; align-items:center; min-height:44px; padding:0 6px; -webkit-tap-highlight-color:rgba(255,255,255,.2); touch-action:manipulation; }
  .navbar a:hover{ color:#00d4ff; }
  .navbar span{ color:#00d4ff; font-size:14px; }

  .container{ max-width:1000px; margin:0 auto; padding:34px 18px; }
  .header{ background:linear-gradient(135deg,var(--navy),var(--purple)); color:#fff; padding:32px 28px; border-radius:20px; margin-bottom:24px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.45); }
  .header .badge{ display:inline-block; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.25); font-size:13.5px; font-weight:700; padding:5px 14px; border-radius:20px; margin-bottom:14px; }
  .header h1{ font-size:24px; font-weight:800; margin-bottom:12px; direction:ltr; line-height:1.35; }
  .header .meta{ font-size:14px; opacity:.9; }

  .card{ background:#fff; border-radius:18px; margin-bottom:22px; box-shadow:0 10px 30px rgba(0,0,0,.18); overflow:hidden; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:44px; padding:14px 20px; cursor:pointer; user-select:none; background:var(--navy); color:#fff; }
  .card-head h2{ font-size:15px; font-weight:800; }
  .card-head .tog{ font-size:13px; opacity:.7; transition:.2s; }
  .raw .card-body{ padding:18px 22px; font-size:16px; line-height:2.05; color:#333; direction:rtl; text-align:right; border-top:4px solid var(--amber); }
  .raw:not(.open) .card-body{ display:none; }
  .raw.open .card-head .tog{ transform:rotate(180deg); }

  .guide{ background:#fff; border-radius:16px; padding:18px 22px; margin-bottom:22px; border-right:6px solid var(--purple); box-shadow:0 8px 24px rgba(0,0,0,.15); font-size:15px; line-height:1.95; color:#333; }
  .guide strong{ color:var(--purple); }
  .guide .hint{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:13.5px; color:var(--gray); }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .tbtn{ background:#fff; color:var(--ink); border:2px solid var(--line); min-height:44px; padding:9px 20px; border-radius:24px; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; transition:.2s; }
  .tbtn:hover{ border-color:var(--purple); color:var(--purple); }

  .levelbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:#fff; border:2px solid var(--line); border-radius:14px; padding:10px 14px; margin-bottom:14px; }
  .lvl-label{ font-size:13px; font-weight:800; color:var(--ink); }
  .lvl{ background:var(--soft); color:var(--ink); border:2px solid var(--line); min-height:44px; padding:7px 22px; border-radius:20px; font-family:inherit; font-size:14px; font-weight:800; cursor:pointer; transition:.2s; }
  .lvl:hover{ border-color:var(--purple); color:var(--purple); }
  .lvl.on{ background:var(--navy,#0f3460); border-color:var(--navy,#0f3460); color:#fff; }
  .lvl-note{ display:none; font-size:13px; color:#5E5E7A; margin-inline-start:auto; }
  @media (min-width:560px){ .lvl-note{ display:inline; } }

  .tr-para{ background:#fff; border-radius:16px; margin-bottom:18px; box-shadow:0 8px 24px rgba(0,0,0,.14); overflow:hidden; }
  .tr-phead{ display:flex; align-items:center; justify-content:space-between; padding:11px 18px; background:var(--soft); border-bottom:1px solid var(--line); }
  .tr-plabel{ font-size:13px; font-weight:800; color:#fff; padding:4px 12px; border-radius:8px; }
  .lb-intro{ background:var(--amber); } .lb-arg1{ background:var(--fr); } .lb-arg2{ background:#2e7d32; }
  .lb-arg3{ background:var(--purple); } .lb-arg4{ background:#00695c; } .lb-conc{ background:#b23c17; }
  .tr-ptime{ font-size:12px; color:var(--gray); }

  .tr-flow{ display:flex; flex-wrap:wrap; gap:8px 10px; align-items:flex-end; padding:18px; direction:ltr; }
  .tr-seg{ display:inline-flex; flex-direction:column; align-items:flex-start; cursor:pointer; direction:ltr; min-height:44px; justify-content:flex-end; -webkit-tap-highlight-color:rgba(83,52,131,.15); touch-action:manipulation; }
  .tr-fr{ display:block; background:var(--fr-bg); border:1px solid var(--fr-bd); color:var(--fr); font-weight:700; font-size:15px; padding:4px 9px; border-radius:7px; margin-bottom:4px; direction:ltr; text-align:left; white-space:nowrap; }
  .tr-seg:not(.on) .tr-fr{ visibility:hidden; }
  .tr-fa{ display:block; background:var(--soft); border:1px dashed var(--line); color:#222; font-size:14px; font-weight:600; padding:4px 9px; border-radius:7px; direction:rtl; text-align:left; line-height:1.7; }
  .tr-seg:not(.on) .tr-fa{ border-color:#cdd3e6; background:#eef0f8; }
  .tr-seg:hover .tr-fa{ border-color:var(--purple); color:var(--purple); }

  .missing{ background:#fff; border-radius:16px; padding:40px 24px; text-align:center; color:var(--gray); font-size:16px; box-shadow:0 8px 24px rgba(0,0,0,.14); }
  .footer{ text-align:center; color:rgba(255,255,255,.75); padding:30px 20px 6px; font-size:14px; }
  .footer strong{ color:#fff; }
  #top{ position:fixed; bottom:18px; left:18px; background:var(--navy); color:#fff; border:none; width:44px; height:44px; border-radius:12px; cursor:pointer; font-size:18px; box-shadow:0 6px 18px rgba(0,0,0,.4); display:none; }
  #top.show{ display:block; }
  @media(max-width:768px){ .header h1{ font-size:19px; } .tr-fr{ white-space:normal; } }

  /* ── blocs cliquables ── */
  .grp{ font-size:13px; font-weight:800; color:var(--gray); margin:16px 0 8px; }
  .grp:first-child{ margin-top:0; }
  .blgrid{ display:grid; gap:8px; grid-template-columns:1fr; }
  .bl{ display:block; background:var(--soft); border:1px dashed var(--line); border-radius:9px;
       padding:9px 12px; cursor:pointer; min-height:44px;
       -webkit-tap-highlight-color:rgba(83,52,131,.15); touch-action:manipulation; }
  .bl-fa{ display:block; font-size:14.5px; font-weight:600; color:#222; }
  .bl-fa i{ font-style:normal; font-size:12px; color:var(--gray); }
  .bl-n{ display:inline-block; font-family:'Courier New',monospace; font-size:11.5px;
         font-weight:800; color:#fff; background:var(--fr); border-radius:20px;
         padding:1px 7px; margin-inline-start:7px; vertical-align:middle; }
  .bl-list{ display:block; margin-top:6px; }
  .bl-fr{ display:block; font-size:15.5px; font-weight:700; color:var(--fr);
          background:var(--fr-bg); border:1px solid var(--fr-bd); border-radius:7px;
          padding:3px 9px; margin-bottom:4px; direction:ltr; text-align:left; }
  .bl-ex{ display:block; font-size:13.5px; color:var(--gray); font-style:italic;
          margin-top:4px; direction:ltr; text-align:left; }
  .bl:not(.on) .bl-list, .bl:not(.on) .bl-ex{ display:none; }
  .bl:not(.on)::after{ content:"بزن ↓"; display:block; font-size:11.5px; color:var(--gray); margin-top:4px; }

  /* ── échelle ── */
  .ech{ border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:9px; }
  .ech-idea{ font-size:14px; color:var(--gray); margin-bottom:7px; }
  .ech-r{ display:flex; gap:8px; align-items:flex-start; padding:3px 0; }
  .ech-r .k{ flex:none; font-size:11px; font-weight:800; padding:2px 7px; border-radius:5px; margin-top:4px; }
  .ech-r .k.s{ background:#fceeed; color:#b3261e; }
  .ech-r .k.a{ background:var(--fr-bg); color:var(--fr); }
  .ech-r .k.b{ background:#eaf4ef; color:#1f6b4e; }
  .ech-r .t{ direction:ltr; text-align:left; font-size:15.5px; line-height:1.5; }

  /* ── anti-traduction ── */
  .at{ border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:9px; }
  .at-l{ direction:ltr; text-align:left; font-size:15.5px; line-height:1.55; padding:2px 0; }
  .at .bad{ color:#b3261e; text-decoration:line-through; }
  .at .good{ color:#1f6b4e; font-weight:600; }
  .at-w{ font-size:13.5px; color:#444; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .at ul{ margin:6px 14px 0; direction:ltr; text-align:left; }
  .at li{ font-size:14px; color:#444; line-height:1.6; }

  /* ── réseau ── */
  .nb{ border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:9px; }
  .nb h4{ font-size:12.5px; font-weight:800; color:var(--gray); margin-bottom:7px; }
  .nb .chips{ display:flex; flex-wrap:wrap; gap:6px; direction:ltr; }
  .nb .chips span{ font-size:14px; background:var(--soft); border:1px solid var(--line);
                   padding:3px 9px; border-radius:6px; }

  .gr{ border:1px solid var(--line); border-radius:10px; padding:10px 13px; margin-bottom:8px; }
  .gr .e{ direction:ltr; text-align:left; font-size:15px; color:#444; font-style:italic; margin-top:3px; }

  @media(min-width:640px){ .blgrid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }

  /* 🎤 trame de prise de parole */
  .pr-intro{ font-size:14px; color:var(--gray); margin-bottom:14px; }
  .pr-bloc{ border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden; }
  .pr-head{ background:var(--soft); padding:8px 13px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pr-num{ background:var(--navy); color:#fff; font-size:12px; font-weight:800;
           width:22px; height:22px; border-radius:50%; display:inline-flex;
           align-items:center; justify-content:center; flex:none; }
  .pr-tps{ margin-inline-start:auto; font-size:12px; color:var(--gray); font-weight:700; }
  .pr-idees{ list-style:none; padding:11px 13px 4px; margin:0; }
  .pr-idees li{ padding:5px 0 7px; border-bottom:1px dashed var(--line); }
  .pr-idees li:last-child{ border-bottom:0; }
  .pr-fr{ display:block; font-family:'Newsreader',Georgia,serif; direction:ltr; text-align:left;
          font-size:15.5px; font-weight:500; color:var(--navy); }
  .pr-fa{ display:block; font-size:13px; color:var(--gray); margin-top:1px; }
  .pr-amorces{ background:#f7f5fc; border-top:1px solid var(--line); padding:10px 13px;
               display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .pr-lbl{ font-size:12.5px; font-weight:800; color:var(--purple); }
  .pr-am{ font-family:'Newsreader',Georgia,serif; direction:ltr; font-size:14px;
          background:#fff; border:1px solid #d9d2ec; border-radius:16px; padding:3px 11px; }

  /* bouton vers l'entraîneur de parole */
  .go-parler{ display:flex; align-items:center; gap:13px; text-decoration:none; color:#fff;
              background:linear-gradient(135deg,var(--navy),var(--purple));
              border-radius:16px; padding:15px 17px; margin:16px 0 4px; min-height:var(--tap); }
  .gp-ico{ font-size:26px; flex:none; }
  .gp-txt{ flex:1; }
  .gp-txt b{ display:block; font-size:16.5px; font-weight:800; }
  .gp-txt i{ display:block; font-style:normal; font-size:12.5px; opacity:.88; margin-top:2px; }
  .gp-fl{ font-size:22px; flex:none; opacity:.9; }

  /* profil collocationnel */
  .pf-intro{ font-size:13.5px; color:var(--gray); margin-bottom:14px; }
  .pf{ border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden; }
  .pf-head{ background:var(--soft); padding:9px 13px; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .pf-mot{ font-family:'Newsreader',Georgia,serif; direction:ltr; font-size:16.5px;
           font-weight:600; color:var(--navy); }
  .pf-fa{ font-size:13px; color:var(--gray); }
  .pf-ton{ margin-inline-start:auto; font-size:11.5px; font-weight:700; color:var(--gray); }
  .pf-row{ display:flex; gap:9px; padding:8px 13px 0; align-items:baseline; flex-wrap:wrap; }
  .pf-lbl{ font-size:11.5px; font-weight:800; color:var(--purple); flex:none; min-width:74px; }
  .pf-list{ display:flex; flex-wrap:wrap; gap:5px; }
  .pf-list i{ font-family:'Newsreader',Georgia,serif; direction:ltr; font-style:normal;
              font-size:14px; background:#eef4fc; border:1px solid #cfe0f5;
              border-radius:14px; padding:2px 10px; }
  .pf-row:nth-of-type(3) .pf-list i{ background:#f3eefa; border-color:#ddd0ee; }
  .pf-ctx{ font-size:12.5px; color:#6b5b1f; background:#fffaf0; border-top:1px solid var(--line);
           margin-top:9px; padding:8px 13px; }
  .pf-ex{ font-family:'Newsreader',Georgia,serif; direction:ltr; font-size:14.5px;
          color:var(--navy); padding:8px 13px 11px; border-top:1px solid var(--line); }
</style>
</head>
<body>
  <div class="navbar">
    <a href="EO_trainer.html">← همه‌ی تمرین‌ها</a>
    <span>TCF Avec Hoda KHEDMATI</span>
  </div>
  <div class="container" id="root"></div>
  <div class="footer"><p>👩‍🏫 <strong>TCF Avec Hoda KHEDMATI</strong> — تمرین ترجمه‌ی شفاهی</p></div>
  <button id="top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

    <script src="blocs-data.js"></script>
  <script>
    function qs(name){ return new URLSearchParams(location.search).get(name); }
    const id = parseInt(qs('id'), 10);
    
    const data = (typeof BLOCS_SUJETS!=='undefined') ? BLOCS_SUJETS.find(x=>x.id===id) : null;
    const root = document.getElementById('root');

    // Deux formats coexistent : les anciennes entrées ont paragraphs/level à plat,
    // les nouvelles ont un tableau versions[]. On ramène tout à une liste de versions.
    const VERSIONS = !data ? []
      // Les niveaux ne sont plus figés : on prend ceux que la fiche contient,
      // du plus accessible au plus exigeant.
      : (function(){
          const ORDRE = ['a1','n7','b1','b2','c1'];
          const NOM   = { a1:'A1', n7:'11/20', b1:'B1', b2:'B2', c1:'C1' };
          return ORDRE.filter(k => data.textes && data.textes[k])
                      .map(k => ({ id:k, level:NOM[k], paragraphs:data.textes[k] }));
        })();
    // Les versions sont rangées du plus accessible au plus exigeant.
    // Par défaut on ouvre sur C1 (le comportement d'avant), sauf choix mémorisé.
    let vIdx = 0;   // on ouvre sur le niveau le plus accessible de la fiche
    try {
      const saved = localStorage.getItem('hk-blocs-level');
      const i = VERSIONS.findIndex(v => v.id === saved);
      if (i >= 0) vIdx = i;
    } catch(e){}
    const V = () => VERSIONS[vIdx];

    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    if(!data){
      root.innerHTML = `<div class="missing">❌ این موضوع پیدا نشد.<br><a href="index.html" style="color:#00d4ff;">بازگشت</a></div>`;
    } else {
      renderPractice();
    }

    // Changer de niveau : on re-rend la page et on garde le choix pour la prochaine fois.
    window.setLevel = i => {
      if (i === vIdx || !VERSIONS[i]) return;
      vIdx = i;
      try { localStorage.setItem('hk-blocs-level', VERSIONS[i].id); } catch(e){}
      renderPractice();
      window.scrollTo({ top:0, behavior:'smooth' });
    };


    /* ── boîte à outils : mêmes cartes repliables que le reste de la page ── */
    function card(idAttr, titre, corps, ouvert){
      return `<div class="card raw${ouvert?' open':''}" id="${idAttr}">
        <div class="card-head" onclick="document.getElementById('${idAttr}').classList.toggle('open')">
          <h2>${titre}</h2><span class="tog">▲</span>
        </div>
        <div class="card-body">${corps}</div>
      </div>`;
    }

    /* un bloc : persan visible, français au clic — comme les segments */
    /* un bloc = un sens en persan + PLUSIEURS équivalents français */
    function bl(item){
      const list = Array.isArray(item.blocs) ? item.blocs : [item.bloc];
      return `<span class="bl" onclick="this.classList.toggle('on')">
        <span class="bl-fa">${esc(item.fa)}${item.role?` <i>(${esc(item.role)})</i>`:''}</span>
        <span class="bl-n">${list.length}</span>
        <span class="bl-list">${list.map(x=>`<span class="bl-fr">${esc(x)}</span>`).join('')}</span>
        ${item.ex?`<span class="bl-ex">${esc(item.ex)}</span>`:''}
      </span>`;
    }

    function outilsHtml(){
      const O = data.outils; if (!O) return '';
      const grp = (t, arr) => `<h3 class="grp">${t}</h3><div class="blgrid">${arr}</div>`;
      const corps =
        grp('افعال و ساخت‌ها', O.verbes.map(bl).join('')) +
        grp('کالوکیشن‌ها',    O.collocations.map(bl).join('')) +
        grp('صفت + اسم',      O.adjectifs.map(bl).join('')) +
        grp('عبارت‌های استدلالی', O.expressions.map(bl).join(''));
      return card('outils', '🧱 جعبه‌ی بلوک‌ها — بزن تا همه‌ی معادل‌ها را ببینی', corps, true);
    }


    /* 🎤 lien vers l'entraîneur : un bloc à la fois, pas une liste */
    function pratiqueHtml(){
      if (!data.parcours && !data.pratique) return '';
      return `<a class="go-parler" href="parler.html?id=${data.id}">
        <span class="gp-ico">🎤</span>
        <span class="gp-txt">
          <b>حالا وقت تمرینه!</b>
          <i>مسیرِ تصویری · یک بلوک در هر صفحه · با زمان‌سنج</i>
        </span>
        <span class="gp-fl">←</span>
      </a>`;
    }


    /* profil collocationnel : avec quoi le mot se dit vraiment */
    function profilsHtml(){
      if (!data.profils) return '';
      const TON = { positif:['🟢','plutôt positif'], negatif:['🔴','plutôt négatif'],
                    'négatif':['🔴','plutôt négatif'], neutre:['⚪','neutre'] };
      const corps = data.profils.map(pr => {
        const t = TON[pr.ton] || TON.neutre;
        return `<div class="pf">
          <div class="pf-head">
            <span class="pf-mot">${esc(pr.mot)}</span>
            <span class="pf-fa">${esc(pr.fa)}</span>
            <span class="pf-ton">${t[0]} ${t[1]}</span>
          </div>
          <div class="pf-row"><span class="pf-lbl">با این فعل‌ها</span>
            <span class="pf-list">${pr.verbes.map(v=>`<i>${esc(v)}</i>`).join('')}</span></div>
          <div class="pf-row"><span class="pf-lbl">با این صفت‌ها</span>
            <span class="pf-list">${pr.adjectifs.map(a=>`<i>${esc(a)}</i>`).join('')}</span></div>
          <div class="pf-ctx">${esc(pr.contexte)}</div>
          <div class="pf-ex">${esc(pr.ex)}</div>
        </div>`;
      }).join('');
      return card('prof', '🔗 هر کلمه با چه چیزی می‌آید',
        `<p class="pf-intro">معادلِ فارسی کافی نیست. مهم این است که بدانی کدام فعل و کدام صفت
         با این کلمه می‌آید، و بارِ مثبت دارد یا منفی.</p>${corps}`, false);
    }

    function extrasHtml(){
      let out = '';
      if (data.echelle) out += card('ech', '🔄 یک ایده، سه ارتفاع',
        data.echelle.map(e=>`<div class="ech">
          <div class="ech-idea">${esc(e.fa)}</div>
          <div class="ech-r"><span class="k s">simple</span><span class="t">${esc(e.simple)}</span></div>
          <div class="ech-r"><span class="k a">B2</span><span class="t">${esc(e.b2)}</span></div>
          <div class="ech-r"><span class="k b">B2+</span><span class="t">${esc(e.b2plus)}</span></div>
        </div>`).join(''), false);

      if (data.antiTrad) out += card('anti', '🚫 دام ترجمه',
        data.antiTrad.map(a=>`<div class="at">
          <div class="at-l">❌ <span class="bad">${esc(a.faux)}</span></div>
          <div class="at-l">✅ <span class="good">${esc(a.juste)}</span></div>
          <div class="at-w">${esc(a.pourquoi)}</div>
        </div>`).join(''), false);

      if (data.transferables) out += card('tr', '♻️ جاهای دیگری که به کار می‌آید',
        data.transferables.map(t=>`<div class="at">
          <div class="good" style="font-size:16px">${esc(t.bloc)}</div>
          <ul>${t.ailleurs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
        </div>`).join(''), false);

      if (data.reseau) out += card('net', '🧠 نقشه‌ی موضوع',
        [['اسم‌ها','noms'],['فعل‌ها','verbes'],['صفت‌ها','adjectifs'],
         ['پیامدها','consequences'],['علت‌ها','causes'],['راه‌حل‌ها','solutions']]
        .map(([fa,k])=>`<div class="nb"><h4>${fa}</h4><div class="chips">${
          data.reseau[k].map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>`).join(''), false);

      if (data.grammaire) out += card('gr', '🧪 گرامری که به کار رفته',
        data.grammaire.map(g=>`<div class="gr"><b>${esc(g.structure)}</b><div class="e">${esc(g.ex)}</div></div>`).join(''), false);
      return out;
    }

    function renderPractice(){
      const parasHtml = V().paragraphs.map((p,pi)=>{
        const segs = p.segments.map((s,si)=>
          `<span class="tr-seg" data-p="${pi}" data-i="${si}"><span class="tr-fr">${esc(s.fr)}</span><span class="tr-fa">${esc(s.fa)}</span></span>`
        ).join('');
        return `<div class="tr-para"><div class="tr-phead"><span class="tr-plabel ${p.cls}">${esc(p.label)}</span><span class="tr-ptime">${esc(p.time||'')}</span></div><div class="tr-flow">${segs}</div></div>`;
      }).join('');

      root.innerHTML = `
        <div class="header">
          <div class="badge">🧱 بلوک‌ها و کالوکیشن‌ها · ${esc(V().level)}</div>
          <h1>${esc(data.q)}</h1>
          <div class="meta">${esc(data.qFa||'')}<br><b>Thèse :</b> ${esc(data.these||'')}</div>
        </div>
        ${outilsHtml()}
        ${profilsHtml()}
        <div class="guide">
          <strong>🎯 روشِ تمرین:</strong> فارسی را از چپ به راست دنبال کن و بلند به فرانسه بگو. هر جا گیر کردی، روی همان عبارتِ فارسی بزن تا فرانسه‌اش نمایش داده شود؛ دوباره بزن تا پنهان شود.
          <div class="hint">این متن‌ها عمداً دور کالوکیشن‌های مصطلح ساخته شده‌اند. جعبه‌ی بالا همان بلوک‌ها را جدا کرده تا در موضوع‌های دیگر هم به کارت بیایند.</div>
        </div>
        ${pratiqueHtml()}
        ${VERSIONS.length > 1 ? `
        <div class="levelbar">
          <span class="lvl-label">سطح متن:</span>
          ${VERSIONS.map((v,i)=>`<button class="lvl${i===vIdx?' on':''}" onclick="setLevel(${i})">${esc(v.level)}</button>`).join('')}
          <span class="lvl-note">همان استدلال‌ها، دو سطح زبانی</span>
        </div>` : ''}
        <div class="toolbar">
          <button class="tbtn" onclick="revealAll(true)">👁️ نمایش همه</button>
          <button class="tbtn" onclick="revealAll(false)">🙈 مخفی کردن همه</button>
        </div>
        <div id="trainer">${parasHtml}</div>
        ${extrasHtml()}`;

      const upto = V().paragraphs.map(()=>-1);
      function apply(pi){
        document.querySelectorAll(`.tr-seg[data-p="${pi}"]`).forEach(seg=>{
          seg.classList.toggle('on', (+seg.dataset.i) <= upto[pi]);
        });
      }
      document.querySelectorAll('.tr-seg').forEach(seg=>{
        seg.addEventListener('click', ()=>{
          const pi=+seg.dataset.p, i=+seg.dataset.i;
          upto[pi] = (upto[pi] >= i) ? i-1 : i;
          apply(pi);
        });
      });
      window.revealAll = show => V().paragraphs.forEach((p,pi)=>{ upto[pi]=show?p.segments.length-1:-1; apply(pi); });
    }

    window.addEventListener('scroll', ()=> document.getElementById('top').classList.toggle('show', window.pageYOffset>320));
  </script>
</body>
</html>
